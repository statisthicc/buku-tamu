<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layar Antrean — PST BPS Kab. Buton Utara</title>
    <link rel="stylesheet" href="css/style_display.css" />
  </head>
  <body>
    <div id="boot">
      <div class="b-logo">Layar <span>Antrean</span></div>
      <div class="b-bar"><div class="b-fill" id="bootFill"></div></div>
      <div class="b-sub" id="bootSub">Memuat data…</div>
    </div>

    <div class="tv">
      <!-- BODY -->
      <div class="tv-body">
        <div class="tv-col tv-col-left" id="tvColLeft">
          <div class="poster-card">
            <div class="poster-wrap">
              <div class="poster-box">
                <div class="poster-media" id="posterMedia"></div>
                <div class="v-progress"><i></i><i></i><i></i></div>
              </div>
            </div>
            <div class="poster-info">
              <!-- <div class="pi-text">
                <div class="pi-title">Pelayanan Statistik Terpadu</div>
              </div> -->
              <div class="pi-logos">
                <img
                  src="img/logo-bps.png"
                  alt=""
                  onerror="this.style.display = 'none'"
                />
                <img
                  src="img/logo-pst.png"
                  alt=""
                  onerror="this.style.display = 'none'"
                />
              </div>
            </div>
          </div>
        </div>

        <div class="tv-col tv-col-right" id="tvColRight">
          <div class="tv-card tv-card-serving">
            <div class="tvc-pill"><i></i>Sedang dipanggil</div>
            <div class="tvc-label">Antrean</div>
            <div class="tvc-number" id="servingNumber">Belum ada antrean</div>
          </div>
          <div class="tv-card tv-card-next">
            <div class="tvn-title">Antrean Berikutnya</div>
            <div class="tvn-sub">Mohon bersiap saat nomor Anda mendekat.</div>
            <div class="tvc-queue" id="queueList"></div>
            <div class="tvn-note">Nomor dipanggil sesuai urutan antrean.</div>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="tv-footer">
        <div class="tv-datetime">
          <div class="tv-date" id="tvDate"></div>
          <div class="tv-time" id="tvTime">--.-- Wita</div>
        </div>
        <div class="tv-marquee">
          <div class="tv-marquee-track" id="marqueeTrack">
            Silakan menunggu nomor antrian Anda dipanggil oleh petugas
            &nbsp;•&nbsp; Pelayanan Statistik Terpadu BPS Kabupaten Buton Utara
            &nbsp;•&nbsp;
          </div>
        </div>
      </div>
    </div>

    <script src="libs/sql-wasm.js"></script>
    <script src="js/db-manager.js"></script>
    <script src="js/media-manager.js"></script>
    <script src="js/logic_display.js"></script>
  </body>
</html>
